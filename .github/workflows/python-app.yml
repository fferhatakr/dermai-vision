name: DermaScan AI CI/CD 

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: dermascan
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }} 
        ports:
          - 5444:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest opencv-python-headless pytest-mock

    - name: Create Dummy Medical Data Structure
      run: |
        mkdir -p data/MEL data/NV data/BCC
        touch data/MEL/test1.jpg data/NV/test2.jpg data/BCC/test3.jpg
        echo "image,targets,lesion_id,age_approx,sex,anatom_site_general" > full_metadata.csv
        echo "test1,4,LES_001,55.0,female,torso" >> full_metadata.csv
        echo "test2,5,LES_002,30.0,male,back" >> full_metadata.csv

    - name: Run Pytest
      env:
      
        DATABASE_URL: postgresql://postgres:${{ secrets.DB_PASSWORD }}@localhost:5432/dermascan
        JWT_SECRET: ci_test_secret
      run: |
        pytest test_api.py test_data.py test_model.py