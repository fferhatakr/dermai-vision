name: DermaScan AI CI/CD 

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: dermascan
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }} 
        ports:
          - 5444:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Create Dummy Medical Data Structure
      run: |
        mkdir -p data/processed/full_dataset/0_mel
        mkdir -p data/processed/full_dataset/1_nv
        mkdir -p data/processed/full_dataset/2_bcc
        mkdir -p data/processed/full_dataset/3_ak
        mkdir -p data/processed/full_dataset/4_bkl
        mkdir -p data/processed/full_dataset/5_df
        mkdir -p data/processed/full_dataset/6_vasc
        mkdir -p data/processed/full_dataset/7_scc
        mkdir -p data/processed
        echo "image,targets,lesion_id,age_approx,sex,anatom_site_general" > data/processed/full_metadata.csv
        echo "test1,0,LES_001,55.0,female,anterior torso" >> data/processed/full_metadata.csv
        echo "test2,1,LES_002,30.0,male,upper extremity" >> data/processed/full_metadata.csv
        echo "test3,2,LES_003,45.0,female,posterior torso" >> data/processed/full_metadata.csv
        echo "test4,3,LES_004,60.0,male,lower extremity" >> data/processed/full_metadata.csv
        echo "test5,4,LES_005,25.0,female,head/neck" >> data/processed/full_metadata.csv
        echo "test6,5,LES_006,50.0,male,palms/soles" >> data/processed/full_metadata.csv
        echo "test7,6,LES_007,35.0,female,anterior torso" >> data/processed/full_metadata.csv
        echo "test8,7,LES_008,40.0,male,upper extremity" >> data/processed/full_metadata.csv

    - name: Create Dummy Medical Data Structure
      run: |
        mkdir -p data/MEL data/NV data/BCC
        touch data/MEL/test1.jpg data/NV/test2.jpg data/BCC/test3.jpg
        echo "image,targets,lesion_id,age_approx,sex,anatom_site_general" > full_metadata.csv
        echo "test1,4,LES_001,55.0,female,torso" >> full_metadata.csv
        echo "test2,5,LES_002,30.0,male,back" >> full_metadata.csv

    - name: Run Pytest
      env:
      
        DATABASE_URL: postgresql://postgres:${{ secrets.DB_PASSWORD }}@localhost:5432/dermascan
        JWT_SECRET: ci_test_secret
      run: |
        pytest test/test_data.py
        pytest test/test_model.py
        pytest test/test_api.py